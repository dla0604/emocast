name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.filter.outputs.application }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            application:
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'eslint.config.js'
              - '.github/actions/**'
              - '.github/workflows/**'
              - '.github/scripts/benchmark_npm_cache.mjs'
            website:
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'vite.config.ts'

  quality:
    name: Lint, build, and test
    needs: changes
    if: needs.changes.outputs.application == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    uses: ./.github/workflows/node-ci.yml
    with:
      os: ${{ matrix.os }}
      node-version: ${{ matrix.node }}
      publish-pages-artifact: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.node == 22 }}

  deploy:
    name: Deploy GitHub Pages
    needs: [changes, quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.website == 'true' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
