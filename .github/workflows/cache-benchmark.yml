name: npm Cache Benchmark

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Paired cold/warm npm ci measurements
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Measure clean and cached installs
        run: node .github/scripts/benchmark_npm_cache.mjs

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: npm-cache-benchmark
          path: .github/reports/CI_CACHE_BENCHMARK.md
          if-no-files-found: error
          retention-days: 30
